services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: employee-rag-postgres
    environment:
      POSTGRES_DB: employee_rag
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
    ports:
      - "5433:5432"
    volumes:
      - employee_rag_pgdata:/var/lib/postgresql/data

volumes:
  employee_rag_pgdata: