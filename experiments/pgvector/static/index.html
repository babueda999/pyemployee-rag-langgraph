<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employee Policy Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bubble-user: #2563eb;
    --bubble-user-text: #ffffff;
    --bubble-bot: #f1f2f4;
    --bubble-bot-text: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1f2023;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --border: #2c2d31;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --bubble-user: #3b82f6;
      --bubble-user-text: #ffffff;
      --bubble-bot: #2a2b2f;
      --bubble-bot-text: #e6e6e6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 2px;
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--bubble-bot-text);
    border-bottom-left-radius: 4px;
  }
  .sources {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .sources summary {
    cursor: pointer;
    user-select: none;
  }
  .source-item {
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .source-item .meta {
    display: flex;
    justify-content: space-between;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 0 24px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  input[type="text"] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14.5px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Employee Policy Assistant</h1>
    <p>Ask about vacation, sick leave, benefits, and other employee policies.</p>
  </header>
  <div id="log">
    <div class="empty" id="empty-state">No questions yet — try "How many vacation days do I get?"</div>
  </div>
  <form id="ask-form">
    <input type="text" id="question" placeholder="Ask a policy question…" autocomplete="off" />
    <button type="submit" id="send-btn">Ask</button>
  </form>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('ask-form');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');

  function scrollToBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addSources(row, sources) {
    if (!sources || sources.length === 0) return;
    const details = document.createElement('details');
    details.className = 'sources';
    const summary = document.createElement('summary');
    summary.textContent = `Sources (${sources.length})`;
    details.appendChild(summary);
    for (const s of sources) {
      const item = document.createElement('div');
      item.className = 'source-item';
      const page = s.metadata?.page_label ?? s.metadata?.page ?? '?';
      const title = s.metadata?.title ?? s.metadata?.source ?? 'document';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<span>${title} · p.${page}</span><span>${(s.similarity * 100).toFixed(1)}%</span>`;
      const content = document.createElement('div');
      content.textContent = s.content ? s.content.slice(0, 300) : '';
      item.appendChild(meta);
      if (s.content) item.appendChild(content);
      details.appendChild(item);
    }
    row.querySelector('.bubble').after(details);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage('user', question);
    input.value = '';
    sendBtn.disabled = true;

    const typingRow = addMessage('bot', '');
    typingRow.querySelector('.bubble').classList.add('typing');
    typingRow.querySelector('.bubble').textContent = 'Thinking…';

    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) throw new Error(`Request failed: ${res.status}`);
      const data = await res.json();
      typingRow.querySelector('.bubble').classList.remove('typing');
      typingRow.querySelector('.bubble').textContent = data.answer;
      addSources(typingRow, data.sources);
    } catch (err) {
      typingRow.querySelector('.bubble').classList.remove('typing');
      typingRow.querySelector('.bubble').textContent = 'Something went wrong: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      scrollToBottom();
      input.focus();
    }
  });

  input.focus();
</script>
</body>
</html>
