<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employee Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bubble-user: #2563eb;
    --bubble-user-text: #ffffff;
    --bubble-bot: #f1f2f4;
    --bubble-bot-text: #1a1a1a;
    --row-hover: #f3f4f6;
    --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1f2023;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --border: #2c2d31;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --bubble-user: #3b82f6;
      --bubble-user-text: #ffffff;
      --bubble-bot: #2a2b2f;
      --bubble-bot-text: #e6e6e6;
      --row-hover: #232427;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 18px 16px 0;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 2px;
  }
  header p {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--muted);
  }
  nav {
    display: flex;
    gap: 4px;
  }
  nav button {
    border: none;
    background: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  section[hidden] { display: none; }

  /* ---- Employees tab ---- */
  #employees-panel { padding: 16px; overflow-y: auto; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .toolbar input {
    flex: 1;
    min-width: 160px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  .toolbar button {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .toolbar button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th { color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--row-hover); }
  .status-line { color: var(--muted); font-size: 13px; margin: 8px 0; }
  .error-line { color: var(--danger); font-size: 13px; margin: 8px 0; }

  /* ---- Assistant tab ---- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--bubble-bot-text);
    border-bottom-left-radius: 4px;
  }
  .steps {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .steps summary { cursor: pointer; user-select: none; }
  .step-item {
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .step-item .tool-name { font-weight: 600; margin-bottom: 4px; }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 0 24px;
  }
  form#ask-form {
    display: flex;
    gap: 8px;
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  form#ask-form input[type="text"] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14.5px;
  }
  form#ask-form input[type="text"]:focus { outline: 2px solid var(--accent); }
  form#ask-form button {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  form#ask-form button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Employee Assistant</h1>
    <p>Browse employees, or ask about policy, people, or both.</p>
    <nav>
      <button id="tab-employees" class="active">Employees</button>
      <button id="tab-assistant">Assistant</button>
    </nav>
  </header>
  <main>
    <section id="employees-panel">
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Search by name…" autocomplete="off" />
        <button id="search-btn">Search</button>
        <input type="text" id="department-input" placeholder="Filter by department…" autocomplete="off" style="max-width:200px" />
        <button id="filter-btn">Filter</button>
        <button id="refresh-btn" class="primary">Show all</button>
      </div>
      <div id="employees-status" class="status-line">Loading…</div>
      <table id="employees-table" hidden>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary</th></tr>
        </thead>
        <tbody id="employees-body"></tbody>
      </table>
    </section>

    <section id="assistant-panel" hidden>
      <div id="log">
        <div class="empty" id="empty-state">No questions yet — try "Is employee 1 eligible for remote work?"</div>
      </div>
      <form id="ask-form">
        <input type="text" id="question" placeholder="Ask about policy, an employee, or both…" autocomplete="off" />
        <button type="submit" id="send-btn">Ask</button>
      </form>
    </section>
  </main>
</div>

<script>
  // ---------- Navigation ----------
  const tabEmployees = document.getElementById('tab-employees');
  const tabAssistant = document.getElementById('tab-assistant');
  const employeesPanel = document.getElementById('employees-panel');
  const assistantPanel = document.getElementById('assistant-panel');

  function showTab(tab) {
    const showEmployees = tab === 'employees';
    tabEmployees.classList.toggle('active', showEmployees);
    tabAssistant.classList.toggle('active', !showEmployees);
    employeesPanel.hidden = !showEmployees;
    assistantPanel.hidden = showEmployees;
    if (!showEmployees) document.getElementById('question').focus();
  }
  tabEmployees.addEventListener('click', () => showTab('employees'));
  tabAssistant.addEventListener('click', () => showTab('assistant'));

  // ---------- Employees tab ----------
  const employeesStatus = document.getElementById('employees-status');
  const employeesTable = document.getElementById('employees-table');
  const employeesBody = document.getElementById('employees-body');
  const searchInput = document.getElementById('search-input');
  const departmentInput = document.getElementById('department-input');

  function renderEmployees(employees) {
    employeesBody.innerHTML = '';
    if (!employees || employees.length === 0) {
      employeesTable.hidden = true;
      employeesStatus.textContent = 'No employees found.';
      employeesStatus.className = 'status-line';
      return;
    }
    for (const e of employees) {
      const tr = document.createElement('tr');
      const salary = e.salary != null ? `$${Number(e.salary).toLocaleString()}` : '';
      tr.innerHTML = `<td>${e.id}</td><td>${e.firstName ?? ''} ${e.lastName ?? ''}</td><td>${e.email ?? ''}</td><td>${e.department ?? ''}</td><td>${salary}</td>`;
      employeesBody.appendChild(tr);
    }
    employeesTable.hidden = false;
    employeesStatus.textContent = `${employees.length} employee(s)`;
    employeesStatus.className = 'status-line';
  }

  async function loadEmployees(url) {
    employeesStatus.textContent = 'Loading…';
    employeesStatus.className = 'status-line';
    employeesTable.hidden = true;
    try {
      const res = await fetch(url);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed: ${res.status}`);
      }
      renderEmployees(await res.json());
    } catch (err) {
      employeesStatus.textContent = err.message;
      employeesStatus.className = 'error-line';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', () => {
    searchInput.value = '';
    departmentInput.value = '';
    loadEmployees('/api/employees');
  });
  document.getElementById('search-btn').addEventListener('click', () => {
    const name = searchInput.value.trim();
    if (!name) return loadEmployees('/api/employees');
    loadEmployees(`/api/employees/search?name=${encodeURIComponent(name)}`);
  });
  document.getElementById('filter-btn').addEventListener('click', () => {
    const dept = departmentInput.value.trim();
    if (!dept) return loadEmployees('/api/employees');
    loadEmployees(`/api/employees?department=${encodeURIComponent(dept)}`);
  });
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('search-btn').click(); });
  departmentInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('filter-btn').click(); });

  loadEmployees('/api/employees');

  // ---------- Assistant tab ----------
  const log = document.getElementById('log');
  const askForm = document.getElementById('ask-form');
  const questionInput = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function addSteps(row, steps) {
    if (!steps || steps.length === 0) return;
    const details = document.createElement('details');
    details.className = 'steps';
    const summary = document.createElement('summary');
    summary.textContent = `Tools used (${steps.length})`;
    details.appendChild(summary);
    for (const step of steps) {
      const item = document.createElement('div');
      item.className = 'step-item';
      const name = document.createElement('div');
      name.className = 'tool-name';
      name.textContent = step.tool;
      const result = document.createElement('div');
      result.textContent = step.result.slice(0, 400);
      item.appendChild(name);
      item.appendChild(result);
      details.appendChild(item);
    }
    row.querySelector('.bubble').after(details);
  }

  askForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;

    addMessage('user', question);
    questionInput.value = '';
    sendBtn.disabled = true;

    const typingRow = addMessage('bot', '');
    typingRow.querySelector('.bubble').classList.add('typing');
    typingRow.querySelector('.bubble').textContent = 'Thinking…';

    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed: ${res.status}`);
      }
      const data = await res.json();
      typingRow.querySelector('.bubble').classList.remove('typing');
      typingRow.querySelector('.bubble').textContent = data.answer;
      addSteps(typingRow, data.steps);
    } catch (err) {
      typingRow.querySelector('.bubble').classList.remove('typing');
      typingRow.querySelector('.bubble').textContent = 'Something went wrong: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
      questionInput.focus();
    }
  });
</script>
</body>
</html>
