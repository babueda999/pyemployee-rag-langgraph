<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employee Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bubble-user: #2563eb;
    --bubble-user-text: #ffffff;
    --bubble-bot: #f1f2f4;
    --bubble-bot-text: #1a1a1a;
    --row-hover: #f3f4f6;
    --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1f2023;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --border: #2c2d31;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --bubble-user: #3b82f6;
      --bubble-user-text: #ffffff;
      --bubble-bot: #2a2b2f;
      --bubble-bot-text: #e6e6e6;
      --row-hover: #232427;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 18px 16px 0;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 2px;
  }
  header p {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--muted);
  }
  nav {
    display: flex;
    gap: 4px;
  }
  nav button {
    border: none;
    background: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  section[hidden] { display: none; }

  /* ---- Employees tab ---- */
  #employees-panel { padding: 16px; overflow-y: auto; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .toolbar input {
    flex: 1;
    min-width: 160px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  .toolbar button {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .toolbar button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th { color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--row-hover); }
  .status-line { color: var(--muted); font-size: 13px; margin: 8px 0; }
  .error-line { color: var(--danger); font-size: 13px; margin: 8px 0; }

  /* ---- Assistant tab ---- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--bubble-bot-text);
    border-bottom-left-radius: 4px;
  }
  .proc-log {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 6px;
  }
  .proc-line {
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--border);
    color: var(--text);
    white-space: nowrap;
  }
  .badge.badge-rag { background: #dbeafe; color: #1e3a8a; }
  .badge.badge-employee { background: #dcfce7; color: #14532d; }
  .badge.badge-employee-java { background: #fef3c7; color: #78350f; }
  @media (prefers-color-scheme: dark) {
    .badge.badge-rag { background: #1e3a8a; color: #dbeafe; }
    .badge.badge-employee { background: #14532d; color: #dcfce7; }
    .badge.badge-employee-java { background: #78350f; color: #fef3c7; }
  }
  .proc-line.done { opacity: 0.65; }
  .agent-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .step-item .step-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .steps {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .steps summary { cursor: pointer; user-select: none; }
  .step-item {
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .step-item .tool-name { font-weight: 600; }
  .bubble .chat-table { margin-top: 10px; font-size: 13px; }
  .bubble .chat-table th, .bubble .chat-table td { padding: 6px 10px; }
  .bubble .chat-table caption { text-align: left; color: var(--muted); font-size: 12px; padding-bottom: 4px; }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 0 24px;
  }
  .role-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .role-bar select {
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-weight: 600;
  }
  .role-hint { font-size: 12px; }
  form#ask-form {
    display: flex;
    gap: 8px;
    padding: 10px 16px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  form#ask-form input[type="text"] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14.5px;
  }
  form#ask-form input[type="text"]:focus { outline: 2px solid var(--accent); }
  form#ask-form button {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  form#ask-form button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Employee Assistant</h1>
    <p>Browse employees, or ask about policy, people, or both.</p>
    <nav>
      <button id="tab-employees" class="active">Employees</button>
      <button id="tab-assistant">Assistant</button>
    </nav>
  </header>
  <main>
    <section id="employees-panel">
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Search by name…" autocomplete="off" />
        <button id="search-btn">Search</button>
        <input type="text" id="department-input" placeholder="Filter by department…" autocomplete="off" style="max-width:200px" />
        <button id="filter-btn">Filter</button>
        <button id="refresh-btn" class="primary">Show all</button>
      </div>
      <div id="employees-status" class="status-line">Loading…</div>
      <table id="employees-table" hidden>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary</th><th>Remote Eligible</th></tr>
        </thead>
        <tbody id="employees-body"></tbody>
      </table>
    </section>

    <section id="assistant-panel" hidden>
      <div id="log">
        <div class="empty" id="empty-state">No questions yet — try "Is employee 1 eligible for remote work?"</div>
      </div>
      <div class="role-bar">
        <label for="role-select">Acting as</label>
        <select id="role-select">
          <option value="USER">USER</option>
          <option value="MANAGER" selected>MANAGER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <span id="role-hint" class="role-hint"></span>
      </div>
      <form id="ask-form">
        <input type="text" id="question" placeholder="Ask about policy, an employee, or both…" autocomplete="off" />
        <button type="submit" id="send-btn">Ask</button>
      </form>
    </section>
  </main>
</div>

<script>
  // ---------- Navigation ----------
  const tabEmployees = document.getElementById('tab-employees');
  const tabAssistant = document.getElementById('tab-assistant');
  const employeesPanel = document.getElementById('employees-panel');
  const assistantPanel = document.getElementById('assistant-panel');

  function showTab(tab) {
    const showEmployees = tab === 'employees';
    tabEmployees.classList.toggle('active', showEmployees);
    tabAssistant.classList.toggle('active', !showEmployees);
    employeesPanel.hidden = !showEmployees;
    assistantPanel.hidden = showEmployees;
    if (!showEmployees) document.getElementById('question').focus();
  }
  tabEmployees.addEventListener('click', () => showTab('employees'));
  tabAssistant.addEventListener('click', () => showTab('assistant'));

  // ---------- Employees tab ----------
  const employeesStatus = document.getElementById('employees-status');
  const employeesTable = document.getElementById('employees-table');
  const employeesBody = document.getElementById('employees-body');
  const searchInput = document.getElementById('search-input');
  const departmentInput = document.getElementById('department-input');

  function renderEmployees(employees) {
    employeesBody.innerHTML = '';
    if (!employees || employees.length === 0) {
      employeesTable.hidden = true;
      employeesStatus.textContent = 'No employees found.';
      employeesStatus.className = 'status-line';
      return;
    }
    for (const e of employees) {
      const tr = document.createElement('tr');
      const salary = e.salary != null ? `$${Number(e.salary).toLocaleString()}` : '';
      const remote = e.remoteWorkEligible === true ? 'Yes' : e.remoteWorkEligible === false ? 'No' : '';
      tr.innerHTML = `<td>${e.id}</td><td>${e.firstName ?? ''} ${e.lastName ?? ''}</td><td>${e.email ?? ''}</td><td>${e.department ?? ''}</td><td>${salary}</td><td>${remote}</td>`;
      employeesBody.appendChild(tr);
    }
    employeesTable.hidden = false;
    employeesStatus.textContent = `${employees.length} employee(s)`;
    employeesStatus.className = 'status-line';
  }

  async function loadEmployees(url) {
    employeesStatus.textContent = 'Loading…';
    employeesStatus.className = 'status-line';
    employeesTable.hidden = true;
    try {
      const res = await fetch(url);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed: ${res.status}`);
      }
      renderEmployees(await res.json());
    } catch (err) {
      employeesStatus.textContent = err.message;
      employeesStatus.className = 'error-line';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', () => {
    searchInput.value = '';
    departmentInput.value = '';
    loadEmployees('/api/employees');
  });
  document.getElementById('search-btn').addEventListener('click', () => {
    const name = searchInput.value.trim();
    if (!name) return loadEmployees('/api/employees');
    loadEmployees(`/api/employees/search?name=${encodeURIComponent(name)}`);
  });
  document.getElementById('filter-btn').addEventListener('click', () => {
    const dept = departmentInput.value.trim();
    if (!dept) return loadEmployees('/api/employees');
    loadEmployees(`/api/employees?department=${encodeURIComponent(dept)}`);
  });
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('search-btn').click(); });
  departmentInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('filter-btn').click(); });

  loadEmployees('/api/employees');

  // ---------- Assistant tab ----------
  const log = document.getElementById('log');
  const askForm = document.getElementById('ask-form');
  const questionInput = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');
  const roleSelect = document.getElementById('role-select');
  const roleHint = document.getElementById('role-hint');

  // Capabilities enforced by the Java write agent's role guardrail —
  // mirrored from AuthorizationGuardrail (READ/UPDATE/DELETE/SALARY sets).
  const ROLE_HINTS = {
    USER: 'read-only — can ask questions; updates, salary changes, and deletes are refused',
    MANAGER: 'can update records & adjust salaries — cannot delete',
    ADMIN: 'can update & request deletion — deletes still need human confirmation',
  };
  function updateRoleHint() { roleHint.textContent = ROLE_HINTS[roleSelect.value] || ''; }
  roleSelect.addEventListener('change', updateRoleHint);
  updateRoleHint();
  const emptyState = document.getElementById('empty-state');
  let conversationHistory = []; // [{role: 'user'|'assistant', content: string}]

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  // A bot row that shows a live "what's it doing" log (one line per tool
  // call, badged by which agent handles it) above the answer text, so the
  // user can see RAG Agent vs Employee Agent activity as it happens rather
  // than only in the "Tools used" panel after the fact.
  function addBotRow() {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row bot';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const procLog = document.createElement('div');
    procLog.className = 'proc-log';
    const answerText = document.createElement('div');
    answerText.className = 'typing';
    answerText.textContent = 'Thinking…';
    bubble.appendChild(procLog);
    bubble.appendChild(answerText);
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return { row, procLog, answerText };
  }

  function badgeClassFor(agentLabel) {
    if (agentLabel === 'RAG Agent') return 'badge-rag';
    if (agentLabel === 'Employee Agent (Java)') return 'badge-employee-java';
    if (agentLabel === 'Employee Agent') return 'badge-employee';
    return '';
  }

  // Mirror of TOOL_AGENT_LABELS in graph/run.py — keep in sync.
  const AGENT_LABEL_FOR_TOOL = {
    policy_search: 'RAG Agent',
    get_employee: 'Employee Agent',
    search_employee: 'Employee Agent',
    list_employees: 'Employee Agent',
    delegate_employee_write: 'Employee Agent (Java)',
  };

  function makeBadge(agentLabel) {
    const badge = document.createElement('span');
    badge.className = 'badge ' + badgeClassFor(agentLabel);
    badge.textContent = agentLabel;
    return badge;
  }

  function describeToolStart(evt) {
    const args = evt.args || {};
    switch (evt.tool) {
      case 'policy_search':
        return `searching policy docs for "${args.query ?? ''}"`;
      case 'get_employee':
        return `looking up employee ${args.employee_id ?? ''}`;
      case 'search_employee': {
        const bits = [];
        if (args.name) bits.push(`name~"${args.name}"`);
        if (args.department) bits.push(`department="${args.department}"`);
        return `searching employees (${bits.join(', ') || 'all'})`;
      }
      case 'list_employees':
        return 'listing all employees';
      case 'delegate_employee_write':
        return `delegating to Java agent: "${args.request ?? ''}"`;
      default:
        return evt.tool;
    }
  }

  function addProcLine(procLog, evt) {
    const line = document.createElement('div');
    line.className = 'proc-line';
    const badge = makeBadge(evt.agent);
    const text = document.createElement('span');
    text.textContent = describeToolStart(evt);
    line.appendChild(badge);
    line.appendChild(text);
    procLog.appendChild(line);
    return line;
  }

  function addSteps(row, steps) {
    if (!steps || steps.length === 0) return;
    const details = document.createElement('details');
    details.className = 'steps';
    const summary = document.createElement('summary');
    summary.textContent = `Tools used (${steps.length})`;
    details.appendChild(summary);
    for (const step of steps) {
      const item = document.createElement('div');
      item.className = 'step-item';
      const head = document.createElement('div');
      head.className = 'step-head';
      head.appendChild(makeBadge(AGENT_LABEL_FOR_TOOL[step.tool] || 'Agent'));
      const name = document.createElement('div');
      name.className = 'tool-name';
      name.textContent = step.tool;
      head.appendChild(name);
      const result = document.createElement('div');
      result.textContent = step.result.slice(0, 400);
      item.appendChild(head);
      item.appendChild(result);
      details.appendChild(item);
    }
    row.querySelector('.bubble').after(details);
  }

  // Employee tools return one "id=…, name=…, email=…, department=…, salary=…"
  // line per employee; render those as a real table under the answer instead
  // of relying on the model to produce a markdown table.
  const EMPLOYEE_TABLE_TOOLS = new Set(['get_employee', 'search_employee', 'list_employees']);

  function parseEmployeeRows(result) {
    if (typeof result !== 'string') return [];
    const rows = [];
    for (const line of result.split('\n')) {
      const trimmed = line.trim();
      if (!trimmed.startsWith('id=')) continue;
      const fields = {};
      for (const part of trimmed.split(/, (?=[a-zA-Z_]+=)/)) {
        const i = part.indexOf('=');
        if (i > 0) fields[part.slice(0, i)] = part.slice(i + 1);
      }
      if (fields.id !== undefined) rows.push(fields);
    }
    return rows;
  }

  function buildEmployeeTable(rows) {
    const table = document.createElement('table');
    table.className = 'chat-table';
    const caption = document.createElement('caption');
    caption.textContent = `${rows.length} employee${rows.length === 1 ? '' : 's'}`;
    table.appendChild(caption);
    table.innerHTML += '<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary</th><th>Remote Eligible</th></tr></thead>';
    const tbody = document.createElement('tbody');
    for (const r of rows) {
      const tr = document.createElement('tr');
      const cells = ['id', 'name', 'email', 'department'].map((k) => {
        const td = document.createElement('td');
        td.textContent = r[k] ?? '';
        return td;
      });
      const salaryTd = document.createElement('td');
      const salaryNum = Number(r.salary);
      salaryTd.textContent = r.salary && Number.isFinite(salaryNum)
        ? `$${salaryNum.toLocaleString()}`
        : (r.salary ?? '');
      cells.push(salaryTd);
      const remoteTd = document.createElement('td');
      remoteTd.textContent = r.remote_work_eligible === 'True' || r.remote_work_eligible === 'true'
        ? 'Yes'
        : r.remote_work_eligible === 'False' || r.remote_work_eligible === 'false'
          ? 'No'
          : (r.remote_work_eligible ?? '');
      cells.push(remoteTd);
      cells.forEach((td) => tr.appendChild(td));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    return table;
  }

  // Persistent "which agent(s) answered" tag under each bot answer, so the
  // RAG Agent / Employee Agent attribution stays visible after the live
  // proc-log lines scroll or collapse.
  function addAgentTags(row, toolCalls, role) {
    const agents = [...new Set(toolCalls.map(([tool]) => AGENT_LABEL_FOR_TOOL[tool] || 'Agent'))];
    if (!agents.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'agent-tags';
    wrap.append('Answered by');
    for (const a of agents) wrap.appendChild(makeBadge(a));
    if (agents.includes('Employee Agent (Java)')) wrap.append(` — write role ${role}`);
    row.querySelector('.bubble').appendChild(wrap);
  }

  function addEmployeeTables(row, toolCalls) {
    const bubble = row.querySelector('.bubble');
    for (const [tool, result] of toolCalls) {
      if (!EMPLOYEE_TABLE_TOOLS.has(tool)) continue;
      const rows = parseEmployeeRows(result);
      if (rows.length) bubble.appendChild(buildEmployeeTable(rows));
    }
  }

  askForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;

    addMessage('user', question);
    questionInput.value = '';
    sendBtn.disabled = true;

    const { row, procLog, answerText } = addBotRow();
    const activeLines = {};

    try {
      const res = await fetch('/api/ask/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history: conversationHistory, role: roleSelect.value }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed: ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let finalData = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const dataLine = rawEvent.split('\n').find((l) => l.startsWith('data: '));
          if (!dataLine) continue;
          const evt = JSON.parse(dataLine.slice(6));

          if (evt.type === 'tool_start') {
            activeLines[evt.tool] = addProcLine(procLog, evt);
            log.scrollTop = log.scrollHeight;
          } else if (evt.type === 'tool_end') {
            const line = activeLines[evt.tool];
            if (line) line.classList.add('done');
          } else if (evt.type === 'final') {
            finalData = evt;
          }
        }
      }

      if (!finalData) throw new Error('No response received.');

      answerText.classList.remove('typing');
      answerText.textContent = finalData.answer;
      addAgentTags(row, finalData.tool_calls, roleSelect.value);
      addEmployeeTables(row, finalData.tool_calls);
      const steps = finalData.tool_calls.map(([tool, result]) => ({ tool, result }));
      addSteps(row, steps);
      conversationHistory.push({ role: 'user', content: question });
      conversationHistory.push({ role: 'assistant', content: finalData.answer });
    } catch (err) {
      answerText.classList.remove('typing');
      answerText.textContent = 'Something went wrong: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
      questionInput.focus();
    }
  });
</script>
</body>
</html>
